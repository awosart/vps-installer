name: XanMod mirror

# Скачивает свежие пакеты XanMod из официального репозитория
# и публикует их в Releases, чтобы их могли установить ноды,
# для которых deb.xanmod.org / SourceForge закрыты (AWS и др.).

on:
  schedule:
    - cron: "0 3 * * 1"      # каждый понедельник 03:00 UTC
  workflow_dispatch: {}       # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add XanMod repository
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO - https://dl.xanmod.org/archive.key \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/xanmod-archive-keyring.gpg
          gpg --show-keys --with-colons /etc/apt/keyrings/xanmod-archive-keyring.gpg \
            | grep -q 'D38D7D1DA1349567ADED882D86F7D09EE734E623'
          echo "deb [signed-by=/etc/apt/keyrings/xanmod-archive-keyring.gpg] http://deb.xanmod.org noble main" \
            | sudo tee /etc/apt/sources.list.d/xanmod-release.list
          sudo apt-get update -q

      - name: Download packages
        run: |
          set -euo pipefail
          mkdir -p out dl
          : > out/VERSIONS.txt
          for meta in linux-xanmod-x64v3 linux-xanmod-x64v2 linux-xanmod-lts-x64v3 linux-xanmod-lts-x64v2; do
            if ! apt-cache show "$meta" >/dev/null 2>&1; then
              echo "skip: $meta not in repo"; continue
            fi
            img=$(apt-cache depends "$meta" | awk '/Depends: linux-image-/   { print $2; exit }')
            hdr=$(apt-cache depends "$meta" | awk '/Depends: linux-headers-/ { print $2; exit }')
            [ -n "$img" ] && [ -n "$hdr" ] || { echo "skip: $meta has no image/headers deps"; continue; }

            case "$meta" in
              linux-xanmod-lts-*) name="xanmod-lts-${meta#linux-xanmod-lts-}" ;;
              *)                  name="xanmod-main-${meta#linux-xanmod-}" ;;
            esac

            (cd dl && rm -f ./*.deb && apt-get download "$img" "$hdr")
            mv dl/${img}_*.deb "out/${name}-image.deb"
            mv dl/${hdr}_*.deb "out/${name}-headers.deb"
            echo "${name}: ${img} ${hdr}" >> out/VERSIONS.txt
          done
          (cd out && sha256sum ./*.deb | sed 's| \./| |' > SHA256SUMS)
          cat out/VERSIONS.txt
          ls -la out

      - name: Publish release (only if versions changed)
        run: |
          set -euo pipefail
          mkdir -p prev
          if gh release download --pattern VERSIONS.txt -D prev 2>/dev/null \
               && cmp -s prev/VERSIONS.txt out/VERSIONS.txt; then
            echo "No new XanMod versions, nothing to publish."
            exit 0
          fi
          TAG="xanmod-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/* \
            --title "XanMod packages $(date -u +%Y-%m-%d)" \
            --notes-file out/VERSIONS.txt \
            --latest

      - name: Remove old releases (keep 2)
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^xanmod-' | tail -n +3 \
            | xargs -r -n1 gh release delete --cleanup-tag -y
